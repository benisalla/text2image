[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "text2image"
version = "0.1.0"
description = "text2image: twelve modern text-to-image architectures (U-Net DDPM, DiT, JiT, MMDiT, single-stream DiT, SANA, MeanFlow, Transfusion, autoregressive, MaskGIT, VAR, MAR), small enough to train and compare on a CPU."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
  "text-to-image", "diffusion", "flow-matching", "rectified-flow", "dit", "mmdit", "stable-diffusion",
  "flux", "autoregressive", "maskgit", "var", "mar", "vq-vae", "pytorch", "from-scratch",
]
dependencies = ["numpy>=1.24", "pillow>=10", "torch>=2.4"]

[project.scripts]
text2image-train = "text2image.train:main"
text2image-sample = "text2image.sample:main"
text2image-eval = "text2image.evaluate:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/text2image"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
